<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IBS Student Management System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <h1>IBS SMS</h1>
                <span>Student Management System</span>
            </div>
            {% if session.get('user_id') %}
            <div class="user-area">
                <span>{{ session.get('full_name') }}</span>
                <span class="role-badge">{{ session.get('role')|capitalize }}</span>
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
            {% endif %}
        </header>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
        <footer class="footer">
            <p>&copy; 2026 IBS Student Management System</p>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
